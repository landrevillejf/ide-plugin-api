plugins {
    id 'java-library'
}

group = 'com.protonmail.landrevillejf.swingide.plugin.api'
version = '3.0.0-SNAPSHOT'

repositories {
    mavenCentral()
    flatDir {
        dirs "${rootDir}/libs"
    }
}

dependencies {
    // Tes dépendances existantes
    implementation name: 'ide-core-0.3.2-SNAPSHOT', ext: 'jar'
    implementation name: 'common-1.1.1-SNAPSHOT', ext: 'jar'
    implementation name: 'IconManager-1.5.0', ext: 'jar'
    implementation name: 'project-manager-1.0-SNAPSHOT', ext: 'jar'
    implementation 'com.fifesoft:rsyntaxtextarea:3.6.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'

    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // ⭐ POUR QUE LES TESTS PUISSENT TOURNER - AJOUTE CES DÉPENDANCES
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'org.assertj:assertj-core:3.24.1'

    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'  // ← Version plus récente
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'org.assertj:assertj-core:3.24.1'

    // ⭐ LES JARS POUR LES TESTS AUSSI
    testImplementation name: 'ide-core-0.3.2-SNAPSHOT', ext: 'jar'
    testImplementation name: 'common-1.1.1-SNAPSHOT', ext: 'jar'
    testImplementation name: 'IconManager-1.5.0', ext: 'jar'
    testImplementation name: 'project-manager-1.0-SNAPSHOT', ext: 'jar'

    // ⭐ LE CODE SOURCE PRINCIPAL POUR LES TESTS
    testImplementation sourceSets.main.output
}

test {
    useJUnitPlatform()

    // Exclure les tests Cucumber
    filter {
        excludeTestsMatching "*RunCucumberTest"
        excludeTestsMatching "*Cucumber*"
    }

    // ⭐ CONFIGURATION POUR LES TESTS
    systemProperty 'java.awt.headless', 'true'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // ⭐ AUGMENTER LA MÉMOIRE
    minHeapSize = "512m"
    maxHeapSize = "2048m"

    // ⭐ FORCER L'EXÉCUTION SÉQUENTIELLE
    maxParallelForks = 1

    // ⭐ AJOUTER LE RÉPERTOIRE DES TESTS DANS LE CLASSPATH
    classpath = sourceSets.test.runtimeClasspath
}

java {
    withJavadocJar()
    withSourcesJar()
}

jar {
    enabled = true
}

tasks.register('fatJar', Jar) {
    archiveBaseName = 'plugin-api'
    archiveClassifier = 'fat'
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': 'SwingIDE Plugin API',
                'Implementation-Version': project.version,
                'Created-By': "Gradle ${gradle.gradleVersion}"
        )
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

fatJar.dependsOn classes
assemble.dependsOn fatJar