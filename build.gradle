plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'checkstyle'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3' apply true
    id 'org.owasp.dependencycheck' version '12.1.1' apply true
    id 'org.sonarqube' version '5.0.0.4638'
}

group = 'com.protonmail.landrevillejf.ide.plugin.api'
version = project.findProperty('version') ?: '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
    flatDir {
        dirs "${rootDir}/libs"
    }
}

dependencies {
    // internal
    implementation name: 'ide-core-0.3.2-SNAPSHOT', ext: 'jar'
    implementation name: 'common-1.1.1-SNAPSHOT', ext: 'jar'

    implementation name: 'project-manager-1.0-SNAPSHOT', ext: 'jar'

    // external
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'com.fifesoft:rsyntaxtextarea:3.6.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'

    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'org.assertj:assertj-core:3.24.1'
    testImplementation 'ch.qos.logback:logback-classic:1.5.12'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'

    // Karate BDD
    testImplementation 'com.intuit.karate:karate-junit5:1.4.1'

    // Jars pour les tests
    testImplementation name: 'ide-core-0.3.2-SNAPSHOT', ext: 'jar'
    testImplementation name: 'common-1.1.1-SNAPSHOT', ext: 'jar'
    testImplementation name: 'project-manager-1.0-SNAPSHOT', ext: 'jar'

    // Code source principal pour les tests
    testImplementation sourceSets.main.output
}

// Karate feature files live next to their Java runners in src/test/java;
// expose them on the test classpath as resources.
sourceSets {
    test {
        resources {
            srcDir 'src/test/java'
            exclude '**/*.java'
        }
    }
}

// ==================== CHECKSTYLE CONFIGURATION ====================
checkstyle {
    toolVersion = "10.12.5"
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    configProperties = [
        'org.checkstyle.google.suppressionfilter.config': "${rootDir}/config/checkstyle/suppressions.xml"
    ]
    ignoreFailures = false
    maxWarnings = 0
    maxErrors = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// ==================== JACOCO CONFIGURATION ====================
jacoco {
    toolVersion = "0.8.12"
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    systemProperty 'java.awt.headless', 'true'

    jvmArgs = [
            "-Djava.awt.headless=true",
            // IconManager ships a shaded slf4j-simple; pin Logback so tests can capture logs
            "-Dslf4j.provider=ch.qos.logback.classic.spi.LogbackServiceProvider"
    ]

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    reports {
        html.required = true
        junitXml.required = true
    }

    jacoco {
        enabled = true
        destinationFile = layout.buildDirectory.file("jacoco/test.exec").get().asFile
    }

    finalizedBy jacocoTestReport
}

// ⭐ CORRECTION - VERSION PROPRE
jacocoTestReport {
    dependsOn test
    dependsOn javadoc
    mustRunAfter test, javadoc

    description = 'Generate JaCoCo coverage report'
    executionData fileTree(project.rootDir.absolutePath).include("**/build/jacoco/*.exec")

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/test/**',
                    '**/mock/**',
                    '**/cucumber/**',
                    '**/karate/**',
                    '**/*Test*',
                    '**/*Runner*',
                    '**/bdd/**'
            ])
        }))
    }
}

// ⭐ STRICT COVERAGE GATE: 100% on all counters
jacocoTestCoverageVerification {
    dependsOn test

    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'CLASS'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/test/**',
                    '**/mock/**',
                    '**/cucumber/**',
                    '**/karate/**',
                    '**/*Test*',
                    '**/*Runner*',
                    '**/bdd/**'
            ])
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

// ⭐ NETTOYER LES CACHES JACOCO
tasks.register('cleanJacoco') {
    delete "${buildDir}/jacoco"
    delete "${buildDir}/reports/jacoco"
}

cleanJacoco.mustRunAfter test
jacocoTestReport.dependsOn cleanJacoco

// ⭐ TÂCHE POUR FORCER LA GÉNÉRATION DU RAPPORT
tasks.register('jacocoGenerateReport') {
    dependsOn jacocoTestReport
    doLast {
        println "JaCoCo report generated at: ${buildDir}/reports/jacoco/test/html/index.html"
    }
}

// ==================== PIT MUTATION TESTING ====================
apply plugin: 'info.solidsoft.pitest'
pitest {
    targetClasses = ['com.protonmail.landrevillejf.ide.plugin.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutators = ['DEFAULTS']
    verbose = true
    junit5PluginVersion = '1.2.1'
    mutationThreshold = 100
    coverageThreshold = 100
    testStrengthThreshold = 100
    failWhenNoMutations = false
    skipFailingTests = false

    // Lock acquire/release and background scheduler registration have no
    // observable effect in single-threaded unit tests; mutating them only
    // produces equivalent mutants.
    avoidCallsTo = [
            'java.util.concurrent.locks',
            'java.util.concurrent.ScheduledExecutorService',
            'java.util.concurrent.Executors',
            // JVM shutdown hook registration is not observable inside unit tests
            'java.lang.Runtime'
    ]

    excludedClasses = [
            '**.test.*',
            '**.mock.*',
            '**.dto.*',
            '**.config.*',
            '**.Main*',
            '**.Application*',
            '**.bdd.*',
            '**.cucumber.*',
            '**.karate.*'
    ]

    excludedMethods = ['main', 'toString', 'hashCode', 'equals', 'clone']
    jvmArgs = ['-Djava.awt.headless=true',
               '-Dslf4j.provider=ch.qos.logback.classic.spi.LogbackServiceProvider']
}

// ==================== JAVA CONFIGURATION ====================
java {
    withJavadocJar()
    withSourcesJar()
}

// ⭐ DÉSACTIVER JAVADOC POUR LE CI (ÉVITE LES PROBLÈMES)
tasks.named('javadoc') {
    enabled = false
}

jar {
    enabled = true
}

tasks.register('fatJar', Jar) {
    archiveBaseName = 'plugin-api'
    archiveClassifier = 'fat'
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': 'IDE Plugin API',
                'Implementation-Version': project.version,
                'Created-By': "Gradle ${gradle.gradleVersion}"
        )
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

fatJar.dependsOn classes
assemble.dependsOn fatJar

// ==================== CUCUMBER BDD ====================
tasks.register('cucumberTest', Test) {
    group = 'verification'
    description = 'Run Cucumber BDD tests'

    useJUnitPlatform()

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    systemProperty 'cucumber.plugin', 'pretty, html:build/reports/cucumber/cucumber-report.html, json:build/reports/cucumber/cucumber-report.json'
    systemProperty 'cucumber.glue', 'com.protonmail.landrevillejf.ide.plugin.bdd.steps'
    systemProperty 'cucumber.features', 'src/test/resources/features'

    jvmArgs = ['-Dslf4j.provider=ch.qos.logback.classic.spi.LogbackServiceProvider']

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    reports {
        html.required = true
        junitXml.required = true
    }

    failFast = false
    ignoreFailures = false

    onlyIf {
        file("${project.projectDir}/src/test/resources/features").exists()
    }
}

// ==================== OWASP DEPENDENCY CHECK ====================
dependencyCheck {
    failBuildOnCVSS = 7
    suppressionFile = 'dependency-check-suppressions.xml'
    analyzers {
        assemblyEnabled = false
    }
}

tasks.register('dependencyCheckModule') {
    group = 'verification'
    description = 'Run OWASP Dependency-Check'
    dependsOn tasks.named('dependencyCheckAnalyze')
}

// ==================== TÂCHES UTILITAIRES ====================
tasks.register('runAllChecks') {
    group = 'verification'
    description = 'Run all verification tasks (tests, coverage, mutation, security)'
    dependsOn test, checkstyleMain, checkstyleTest, jacocoTestReport, pitest, dependencyCheckAnalyze
}

// ==================== SONARQUBE ====================
sonar {
    properties {
        property "sonar.projectKey", "ide-plugin-api"
        property "sonar.projectName", "IDE Plugin API"
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/xml/jacocoTestReport.xml"
        property "sonar.junit.reportPaths", "${buildDir}/test-results/test"
    }
}

// ==================== PUBLISHING (GitHub Packages) ====================
publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/landrevillejf/ide-plugin-api')
            credentials {
                username = System.getenv('USERNAME')
                password = System.getenv('TOKEN')
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'ide-plugin-api'
            version = project.version
        }
    }
}