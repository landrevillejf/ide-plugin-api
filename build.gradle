import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3' apply true
    id 'org.owasp.dependencycheck' version '12.1.1' apply true
}

group = 'com.protonmail.landrevillejf.ide.plugin.api'
version = '3.0.0-SNAPSHOT'

repositories {
    mavenCentral()
    flatDir {
        dirs "${rootDir}/libs"
    }
}

dependencies {
    // Tes dépendances existantes
    implementation name: 'ide-core-0.3.2-SNAPSHOT', ext: 'jar'
    implementation name: 'common-1.1.1-SNAPSHOT', ext: 'jar'
    implementation name: 'IconManager-1.5.0', ext: 'jar'
    implementation name: 'project-manager-1.0-SNAPSHOT', ext: 'jar'
    implementation 'com.fifesoft:rsyntaxtextarea:3.6.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'

    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // ⭐ POUR QUE LES TESTS PUISSENT TOURNER - AJOUTE CES DÉPENDANCES
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'org.assertj:assertj-core:3.24.1'

    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'  // ← Version plus récente
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'org.assertj:assertj-core:3.24.1'

    // ⭐ LES JARS POUR LES TESTS AUSSI
    testImplementation name: 'ide-core-0.3.2-SNAPSHOT', ext: 'jar'
    testImplementation name: 'common-1.1.1-SNAPSHOT', ext: 'jar'
    testImplementation name: 'IconManager-1.5.0', ext: 'jar'
    testImplementation name: 'project-manager-1.0-SNAPSHOT', ext: 'jar'

    // ⭐ LE CODE SOURCE PRINCIPAL POUR LES TESTS
    testImplementation sourceSets.main.output
}

test {
    useJUnitPlatform()

    // Exclure les tests Cucumber
    filter {
        excludeTestsMatching "*RunCucumberTest"
        excludeTestsMatching "*Cucumber*"
    }

    // ⭐ CONFIGURATION POUR LES TESTS
    systemProperty 'java.awt.headless', 'true'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // ⭐ AUGMENTER LA MÉMOIRE
    minHeapSize = "512m"
    maxHeapSize = "2048m"

    // ⭐ FORCER L'EXÉCUTION SÉQUENTIELLE
    maxParallelForks = 1

    // ⭐ AJOUTER LE RÉPERTOIRE DES TESTS DANS LE CLASSPATH
    classpath = sourceSets.test.runtimeClasspath
}

java {
    withJavadocJar()
    withSourcesJar()
}

jar {
    enabled = true
}

tasks.register('fatJar', Jar) {
    archiveBaseName = 'plugin-api'
    archiveClassifier = 'fat'
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': 'IDE Plugin API',
                'Implementation-Version': project.version,
                'Created-By': "Gradle ${gradle.gradleVersion}"
        )
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

fatJar.dependsOn classes
assemble.dependsOn fatJar

def cucumberModules = {
    subprojects.findAll { it.file('src/test/resources/features').exists() }
}

def calculateCucumberScenarioStatus = { Map scenario ->
    def statuses = []

    (scenario.before ?: []).each { hook ->
        if (hook instanceof Map && hook.result instanceof Map && hook.result.status) {
            statuses << hook.result.status.toString().toLowerCase(Locale.ROOT)
        }
    }

    (scenario.steps ?: []).each { step ->
        if (step instanceof Map && step.result instanceof Map && step.result.status) {
            statuses << step.result.status.toString().toLowerCase(Locale.ROOT)
        }
    }

    (scenario.after ?: []).each { hook ->
        if (hook instanceof Map && hook.result instanceof Map && hook.result.status) {
            statuses << hook.result.status.toString().toLowerCase(Locale.ROOT)
        }
    }

    if (statuses.any { it in ['failed', 'ambiguous'] }) {
        return 'FAILED'
    }
    if (statuses.any { it in ['skipped', 'pending', 'undefined'] }) {
        return 'SKIPPED'
    }
    if (statuses.any { it == 'passed' }) {
        return 'PASSED'
    }

    'UNKNOWN'
}

def escapeHtml = { Object value ->
    (value == null ? '' : value.toString())
            .replace('&', '&amp;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
            .replace('"', '&quot;')
            .replace("'", '&#39;')
}

jacoco {
    toolVersion = "0.8.12" // Dernière version
}

test {
    useJUnitPlatform()

    // Exclure les tests Cucumber
    exclude '**/PluginServicesRunnerTests*'
    exclude '**/RunCucumberTest*'

    // Exclure les classes de test qui causent des problèmes avec JaCoCo
    jacoco {
        excludes = [
                '**/SecurePluginClassLoaderTest*',
                '**/DefaultPluginManagerTest*'
        ]
    }

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
        showStandardStreams = true
    }

    // Configuration headless pour les tests Swing
    systemProperty 'java.awt.headless', 'true'
    // Désactiver JaCoCo pour certains tests
    systemProperty 'jacoco.skip', 'true'

    jvmArgs = [
            "-Djava.awt.headless=true",
            "-Dslf4j.provider=ch.qos.logback.classic.spi.LogbackServiceProvider"
    ]

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    reports {
        html.required = true
        junitXml.required = true
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/test/**',
                    '**/mock/**',
                    '**/cucumber/**',
                    '**/*Test*',
                    '**/*Runner*',
                    '**/SecurePluginClassLoader*',
                    '**/DefaultPluginManager*'
            ])
        }))
    }
}

// Désactiver complètement jacoco pour les tâches de test problématiques
tasks.withType(Test).configureEach {
    jacoco {
        enabled = false
    }
}

// ==================== CUCUMBER BDD ====================
// Features  : src/test/resources/features/*.feature
// Steps     : src/test/java/**/bdd/steps/
// Runner    : src/test/java/**/bdd/CucumberRunnerTest.java
// Commande  : ./gradlew :module:cucumberTest
// =======================================================

tasks.register('cucumberTest', Test) {
    group = 'verification'
    description = 'Run Cucumber BDD tests'

    useJUnitPlatform()

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // Filtrer uniquement les classes annotées @Suite / Cucumber
    filter {
        includeTestsMatching '*CucumberRunner*'
        includeTestsMatching '*bdd.*'
    }

    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    systemProperty 'cucumber.plugin', 'pretty, html:build/reports/cucumber/cucumber-report.html, json:build/reports/cucumber/cucumber-report.json'
    systemProperty 'cucumber.glue', 'com.protonmail.landrevillejf.ide.plugin.bdd.steps'
    systemProperty 'cucumber.features', 'src/test/resources/features'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    reports {
        html.required = true
        junitXml.required = true
    }

    // Ne pas échouer si aucun test Cucumber n'existe dans le module
    failFast = false
    ignoreFailures = false

    onlyIf {
        // Exécuter seulement si le répertoire features/ existe
        file("${project.projectDir}/src/test/resources/features").exists()
    }
}

// Configuration PIT - UTILISER L'EXTENSION, PAS UNE TÂCHE
pitest {
    targetClasses = ['com.protonmail.landrevillejf.*']
    threads = Runtime.runtime.availableProcessors()
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutators = ['DEFAULTS']
    verbose = true
    junit5PluginVersion = '1.2.1'
    mutationThreshold = 0
    coverageThreshold = 0
    failWhenNoMutations = false

    excludedClasses = [
            '*.test.*',
            '*.mock.*',
            '*.dto.*',
            '*.config.*',
            '*.Main*',
            '*.Application*'
    ]
    excludedMethods = ['main', 'toString', 'hashCode', 'equals', 'clone']
}

// ==================== TÂCHES OWASP DEPENDENCY-CHECK ====================

tasks.register('dependencyCheckAll') {
    group = 'verification'
    description = 'Run OWASP Dependency-Check on all subprojects'

    dependsOn subprojects.collect { it.tasks.named('dependencyCheckAnalyze') }

    doLast {
        println "\n=== OWASP Dependency-Check Reports ==="
        subprojects.each { p ->
            def htmlReport = file("${p.buildDir}/reports/dependency-check/dependency-check-report.html")
            def jsonReport = file("${p.buildDir}/reports/dependency-check/dependency-check-report.json")
            if (htmlReport.exists()) {
                println "${p.name}: ${htmlReport}"
            }
        }
        println "=======================================\n"
    }
}

tasks.register('dependencyCheckModule') {
    group = 'verification'
    description = 'Run OWASP Dependency-Check for a specific module (usage: -Pmodule=module-name)'

    doFirst {
        def moduleName = project.findProperty('module')
        if (moduleName) {
            def module = subprojects.find { it.name == moduleName }
            if (module) {
                dependsOn module.tasks.named('dependencyCheckAnalyze')
            } else {
                throw new GradleException("Module '$moduleName' not found. Available modules: ${subprojects.collect { it.name }}")
            }
        } else {
            throw new GradleException("Please specify module with -Pmodule=module-name")
        }
    }
}

// ==================== FIN TÂCHES OWASP ====================

// ==================== TÂCHES PIT ====================

tasks.register('pitestAll') {
    group = 'verification'
    description = 'Run PIT mutation tests for all subprojects'

    dependsOn subprojects.findAll { it.tasks.findByName('pitest') != null }.collect { it.tasks.pitest }

    doLast {
        println "\n=== PIT Mutation Test Reports ==="
        subprojects.each { p ->
            def pitestReport = file("${p.buildDir}/reports/pitest/index.html")
            if (pitestReport.exists()) {
                println "${p.name}: ${pitestReport}"
            } else {
                println "${p.name}: No PIT report found"
            }
        }
        println "================================\n"
    }
}

tasks.register('pitestModule') {
    group = 'verification'
    description = 'Run PIT tests for a specific module (usage: -Pmodule=module-name)'

    doFirst {
        def moduleName = project.findProperty('module')
        if (moduleName) {
            def module = subprojects.find { it.name == moduleName }
            if (module && module.tasks.findByName('pitest')) {
                dependsOn module.tasks.pitest
            } else {
                throw new GradleException("Module '$moduleName' not found or doesn't have pitest task")
            }
        } else {
            throw new GradleException("Please specify module with -Pmodule=module-name")
        }
    }
}

// ==================== FIN TÂCHES PIT ====================

// ==================== TÂCHES CUCUMBER BDD ====================

tasks.register('cucumberAggregateReport') {
    group = 'verification'
    description = 'Generate a single aggregated Cucumber report with scenarios from every module that contains features'

    dependsOn provider {
        cucumberModules().collect { it.tasks.named('cucumberTest') }
    }

    outputs.dir(layout.buildDirectory.dir('reports/cucumber-aggregate'))

    doLast {
        def outputDir = layout.buildDirectory.dir('reports/cucumber-aggregate').get().asFile
        def aggregateJsonFile = new File(outputDir, 'cucumber-report.json')
        def aggregateHtmlFile = new File(outputDir, 'index.html')
        def reportEntries = cucumberModules().collect { module ->
            [
                    module  : module,
                    jsonFile : module.layout.buildDirectory.file('reports/cucumber/cucumber-report.json').get().asFile,
                    htmlFile : module.layout.buildDirectory.file('reports/cucumber/cucumber-report.html').get().asFile
            ]
        }.findAll { it.jsonFile.exists() }

        outputDir.mkdirs()

        if (reportEntries.isEmpty()) {
            throw new GradleException('No Cucumber JSON reports were found. Run the module cucumber tests first.')
        }

        def slurper = new JsonSlurper()
        def mergedFeatures = []
        def moduleSummaries = []
        def scenarioRows = []
        def totalScenarios = 0
        def passedScenarios = 0
        def skippedScenarios = 0
        def failedScenarios = 0

        reportEntries.each { entry ->
            def parsed = slurper.parse(entry.jsonFile)
            def features = parsed instanceof List ? parsed : []
            def moduleFeatureCount = 0
            def moduleScenarioCount = 0

            features.each { feature ->
                mergedFeatures << feature
                moduleFeatureCount++

                (feature.elements ?: []).findAll { element ->
                    element instanceof Map && element.type in ['scenario', 'scenario_outline']
                }.each { scenario ->
                    def scenarioStatus = calculateCucumberScenarioStatus(scenario)

                    moduleScenarioCount++
                    totalScenarios++

                    switch (scenarioStatus) {
                        case 'PASSED':
                            passedScenarios++
                            break
                        case 'SKIPPED':
                            skippedScenarios++
                            break
                        default:
                            failedScenarios++
                            break
                    }

                    scenarioRows << [
                            module      : entry.module.name,
                            featureName : feature.name ?: '(Unnamed feature)',
                            scenarioName: scenario.name ?: '(Unnamed scenario)',
                            status      : scenarioStatus,
                            location    : feature.uri ?: feature.id ?: ''
                    ]
                }
            }

            moduleSummaries << [
                    name         : entry.module.name,
                    featureCount : moduleFeatureCount,
                    scenarioCount: moduleScenarioCount,
                    htmlReport   : entry.htmlFile.exists() ? entry.htmlFile.toURI().toString() : null
            ]
        }

        aggregateJsonFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(mergedFeatures))

        def summaryRowsHtml = moduleSummaries.collect { summary ->
            def reportCell = summary.htmlReport
                    ? "<a href=\"${escapeHtml(summary.htmlReport)}\">module report</a>"
                    : '—'
            """
            <tr>
                <td>${escapeHtml(summary.name)}</td>
                <td>${summary.featureCount}</td>
                <td>${summary.scenarioCount}</td>
                <td>${reportCell}</td>
            </tr>
            """.stripIndent().trim()
        }.join('\n')

        def scenarioRowsHtml = scenarioRows.collect { row ->
            def statusClass = row.status.toLowerCase(Locale.ROOT)
            """
            <tr>
                <td>${escapeHtml(row.module)}</td>
                <td>${escapeHtml(row.featureName)}</td>
                <td>${escapeHtml(row.scenarioName)}</td>
                <td class=\"status ${statusClass}\">${escapeHtml(row.status)}</td>
                <td>${escapeHtml(row.location)}</td>
            </tr>
            """.stripIndent().trim()
        }.join('\n')

        aggregateHtmlFile.text = """
        <!DOCTYPE html>
        <html lang=\"en\">
        <head>
            <meta charset=\"UTF-8\" />
            <title>Aggregated Cucumber Report</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 24px; color: #1f2937; }
                h1, h2 { margin-bottom: 0.5rem; }
                .summary { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0 24px; }
                .card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; min-width: 160px; }
                .card strong { display: block; font-size: 1.6rem; margin-top: 8px; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
                th, td { border: 1px solid #d1d5db; padding: 10px; text-align: left; vertical-align: top; }
                th { background: #e5e7eb; }
                .status { font-weight: 700; }
                .status.passed { color: #166534; }
                .status.skipped { color: #92400e; }
                .status.failed, .status.unknown { color: #991b1b; }
                code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
            </style>
        </head>
        <body>
            <h1>Aggregated Cucumber Report</h1>
            <p>Generated from <strong>${moduleSummaries.size()}</strong> module(s) with Cucumber scenarios.</p>

            <div class=\"summary\">
                <div class=\"card\"><span>Modules</span><strong>${moduleSummaries.size()}</strong></div>
                <div class=\"card\"><span>Features</span><strong>${mergedFeatures.size()}</strong></div>
                <div class=\"card\"><span>Scenarios</span><strong>${totalScenarios}</strong></div>
                <div class=\"card\"><span>Passed</span><strong>${passedScenarios}</strong></div>
                <div class=\"card\"><span>Skipped</span><strong>${skippedScenarios}</strong></div>
                <div class=\"card\"><span>Failed / Unknown</span><strong>${failedScenarios}</strong></div>
            </div>

            <p>
                Aggregated JSON: <code>${escapeHtml(aggregateJsonFile.absolutePath)}</code><br />
                HTML report: <code>${escapeHtml(aggregateHtmlFile.absolutePath)}</code>
            </p>

            <h2>Modules</h2>
            <table>
                <thead>
                    <tr>
                        <th>Module</th>
                        <th>Features</th>
                        <th>Scenarios</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody>
                    ${summaryRowsHtml}
                </tbody>
            </table>

            <h2>Scenario Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>Module</th>
                        <th>Feature</th>
                        <th>Scenario</th>
                        <th>Status</th>
                        <th>Source</th>
                    </tr>
                </thead>
                <tbody>
                    ${scenarioRowsHtml}
                </tbody>
            </table>
        </body>
        </html>
        """.stripIndent().trim()

        println "\n=== Aggregated Cucumber Report ==="
        println "HTML : ${aggregateHtmlFile}"
        println "JSON : ${aggregateJsonFile}"
        println "==================================\n"
    }
}

tasks.register('cucumberAll') {
    group = 'verification'
    description = 'Run Cucumber BDD tests on all subprojects and generate a single aggregate report'

    dependsOn tasks.named('cucumberAggregateReport')

    doLast {
        println "\n=== Cucumber BDD Reports ==="
        def aggregateReport = layout.buildDirectory.file('reports/cucumber-aggregate/index.html').get().asFile
        if (aggregateReport.exists()) {
            println "aggregate: ${aggregateReport}"
        }
        subprojects.each { p ->
            def htmlReport = p.layout.buildDirectory.file('reports/cucumber/cucumber-report.html').get().asFile
            if (htmlReport.exists()) {
                println "${p.name}: ${htmlReport}"
            }
        }
        println "============================\n"
    }
}

tasks.register('cucumberModule') {
    group = 'verification'
    description = 'Run Cucumber BDD tests for a specific module (usage: -Pmodule=module-name)'

    doFirst {
        def moduleName = project.findProperty('module')
        if (moduleName) {
            def module = subprojects.find { it.name == moduleName }
            if (module) {
                dependsOn module.tasks.named('cucumberTest')
            } else {
                throw new GradleException("Module '$moduleName' not found. Available modules: ${subprojects.collect { it.name }}")
            }
        } else {
            throw new GradleException("Please specify module with -Pmodule=module-name")
        }
    }
}

// ==================== FIN TÂCHES CUCUMBER ====================