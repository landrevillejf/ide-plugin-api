name: Update Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.3.0-RC1)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update gradle.properties
        run: |
          # Remplacer ou ajouter la version dans gradle.properties
          if grep -q "^version=" gradle.properties; then
            sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/" gradle.properties
          else
            echo "version=${{ github.event.inputs.version }}" >> gradle.properties
          fi

      - name: Update README badges
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Supprimer les tirets pour l'URL du badge (1.3.0-RC1 -> 1.3.0RC1)
          BADGE_VERSION=$(echo "$VERSION" | sed 's/-//g')
          
          # Mettre à jour le badge version (pattern: version-XXX)
          sed -i "s/version-[0-9.]*RC[0-9]*/version-$BADGE_VERSION/g" README.md
          
          # Mettre à jour la ligne "Version**:"
          sed -i "s/Version\*\*: .*/Version**: $VERSION/g" README.md

      - name: Update CHANGELOG
        run: |
          DATE=$(date +'%Y-%m-%d')
          VERSION="${{ github.event.inputs.version }}"
          
          # Ajouter la nouvelle version en haut du CHANGELOG (après [Unreleased])
          sed -i "/## \[Unreleased\]/a \\\n## [$VERSION] - $DATE" CHANGELOG.md
          
          # Ajouter l'entrée de comparaison en bas du fichier
          sed -i "/\[unreleased\]:/a [$VERSION]: https://github.com/landrevillejf/ide-plugin-api/compare/v$VERSION...HEAD" CHANGELOG.md

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties README.md CHANGELOG.md
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin main --tags