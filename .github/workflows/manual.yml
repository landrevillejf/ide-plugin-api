name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name to greet'
        required: true
        default: 'World'
        type: string

# ⭐ AJOUTER LES PERMISSIONS - Limiter les permissions du GITHUB_TOKEN
permissions:
  contents: read      # Lecture seule du code
  actions: read       # Lecture des actions
  checks: read        # Lecture des checks

# Alternative plus restrictive (lecture seule) :
# permissions: read-all

# Ou si tu as besoin d'écrire (rare pour un workflow manuel) :
# permissions:
#   contents: write    # Si besoin de créer des releases, etc.

jobs:
  greet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Send greeting
        run: echo "Hello ${{ inputs.name }}"

      - name: Show timestamp
        run: echo "Triggered at $(date)"