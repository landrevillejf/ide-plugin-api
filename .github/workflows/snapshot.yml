  yaml
  name: Publish Snapshot

  on:
    push:
      branches:
        - develop

  jobs:
    publish-snapshot:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'

        - name: Build
          run: |
            chmod +x gradlew
            ./gradlew build fatJar

        - name: Upload Snapshot Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: snapshot-jars
            path: build/libs/*.jar