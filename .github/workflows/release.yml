name: Create Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v2.1.3, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build fatJar --no-daemon

      - name: Verify build output
        run: |
          echo "=== Checking for JAR files ==="
          find build -name "*.jar" -type f || echo "No JAR files found"
          echo ""
          echo "=== Build libs directory ==="
          ls -la build/libs/ || echo "No build/libs directory"

      - name: Prepare Release Assets
        id: prepare
        run: |
          # Create a staging directory
          mkdir -p release-assets
          
          # Copy all JAR files to staging
          find build -name "*.jar" -type f -exec cp {} release-assets/ \;
          
          # List what we're releasing
          echo "Files to include in release:"
          ls -la release-assets/
          
          # Create a JSON array of file paths for the release action
          ASSETS=$(find release-assets -type f | tr '\n' ' ')
          echo "assets=$ASSETS" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.jar
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false  # Don't fail if no files match
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload individual assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/libs/*-fat.jar
          generate_release_notes: false  # Don't regenerate release notes
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}