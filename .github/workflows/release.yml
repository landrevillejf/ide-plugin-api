name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build fatJar --no-daemon

      - name: Debug - Show all files
        run: |
          echo "=== Complete file listing ==="
          find . -name "*.jar" -type f
          echo ""
          echo "=== Build directory ==="
          find build -type f
          echo ""
          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/libs/*.jar,build/libs/*-fat.jar"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: true
          artifactErrorsFailBuild: false