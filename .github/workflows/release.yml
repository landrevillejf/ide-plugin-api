name: Create Release

on:
  push:
    tags:
      - 'v*'  # Déclenché quand on pousse un tag comme v1.0.0, v3.0.1, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permet de créer la release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build fatJar

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/libs/*.jar
            build/libs/*-fat.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}